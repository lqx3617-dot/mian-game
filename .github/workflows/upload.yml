name: build-and-upload
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: restore key
        run: |
          echo "${{ secrets.MP_PRIVATE_KEY }}" > /tmp/k.b64
          base64 -d /tmp/k.b64 > private.key
          chmod 600 private.key
          head -c 30 private.key
      - name: install ci
        run: npm i miniprogram-ci --no-audit --no-fund
      - name: upload
        run: node ci.js
      - name: commit qrcode
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -f qrcode.jpg
          git commit -m "update qrcode" || true
          git push || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrcode
          path: qrcode.jpg
